<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Searchable &amp; Sortable Data Table</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <header class="page-head">
      <div>
        <h1>Expense &amp; Subscription Tracker</h1>
        <p>Vanilla JS table with live search, column sorting, category filters, and URL/localStorage sync.</p>
      </div>
      <div class="summary-pill" id="result-summary">Showing 0 of 0 items</div>
    </header>

    <!-- controls -->
    <section class="controls" aria-label="Table filters">
      <div class="control-group search-group">
        <label for="search-box">Search</label>
        <input type="search" id="search-box" placeholder="Search merchant or note...">
      </div>

      <div class="control-group">
        <label for="category-select">Category</label>
        <select id="category-select">
          <option value="all">All categories</option>
          <option value="Hosting">Hosting</option>
          <option value="Software">Software</option>
          <option value="Hardware">Hardware</option>
